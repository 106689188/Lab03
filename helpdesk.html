<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="CWA Help Desk appointment booking form">
        <meta name="keywords" content="CWA, Help Desk, Appointment, HTML, Form">
        <meta name="author" content="Hassan Abbas">

        <title>CWA Help Desk Appointment</title>
    </head>
<body>
      <a href="http://www.swin.edu.au">
        <img src="logo.png"
        width="110" height="55">
    </a>
        <h1>CWA Help Desk Appointment</h1>
            <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
            <p>Check Blackboard for when CWA tutors will be there.</p>
        <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">

    <fieldset>
        <legend>Student details</legend>
            <p>
                <label for="studentid">Student ID</label>
                <input type="text" name="studentid" id="studentid" size="10" maxlength="10">
            </p>
            <p>
                <label for="givenname">Given Name</label>
                <input type="text" name="givenname" id="givenname" size="15" maxlength="15">
                <label for="familyname">Family Name</label>
                <input type="text" name="familyname" id="familyname" size="15" maxlength="15">
            </p>
    </fieldset>

    <fieldset>
        <legend>Your unit</legend>
            <p>
                <input type="radio" name="unit" id="cos10011" value="COS10011">
                <label for="cos10011">COS10011</label>
                <input type="radio" name="unit" id="cos60004" value="COS60004">
                <label for="cos60004">COS60004</label>
                <input type="radio" name="unit" id="cos60007" value="COS60007">
                <label for="cos60007">COS60007</label>
            </p>
            <p>
                <label for="tutor">Your Tutor</label>
                <select name="tutor" id="tutor">
                    <option value="">Please Select</option>
                    <option value="ahmed">Ahmed</option>
                    <option value="sarah">Sarah</option>
                    <option value="john">John</option>
                </select>
            </p>
    </fieldset>
    <fieldset>
        <legend>Issue</legend>
        <p>
            <label for="html">HTML</label>
            <input type="checkbox" name="issue[]" id="html" value="HTML"
            checked="checked">
            <label for="css">CSS</label>
            <input type="checkbox" name="issue[]" id="css" value="CSS">
            <label for="javascript">JavaScript</label>
            <input type="checkbox" name="issue[]" id="javascript" value="JavaScript">
            <label for="php">PHP</label>
            <input type="checkbox" name="issue[]" id="php" value="PHP">
            <label for="mysql">MySQL</label>
            <input type="checkbox" name="issue[]" id="mysql" value="MySQL">
        </p>
        <p>
            <label for="description">Description of Issue</label><br>
            <textarea name="description" id="description" rows="4" cols="30"
                placeholder="Write description of your problem here..."></textarea>
        </p>
    </fieldset>
    <fieldset>
        <legend>Preferred Date / Time</legend>
        <p>
            <label for="date">Date</label>
            <input type="text" name="date" id="date" placeholder="dd/mm/yyyy" size="20"
            maxlength="10"><br>
            <label for="time">Time</label>
            <input type="text" name="time" id="time" placeholder="00:00" size="20"
            maxlength="5">
        </p>
    </fieldset>
<input type="submit" name="book" value="Book">
<input type="reset" name="reset" value="Reset form">

</form>

</body>
</html>
